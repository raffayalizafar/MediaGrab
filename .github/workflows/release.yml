name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split per ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Stage Android Binaries
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-artifacts/MediaGrab-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-artifacts/MediaGrab-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-artifacts/MediaGrab-android-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/MediaGrab-android-universal.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-artifacts/*

  build-macos:
    name: Build macOS Desktop (.dmg & .zip)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Application
        run: flutter build macos --release

      - name: Package macOS App (.dmg & .zip)
        run: |
          mkdir -p release-artifacts
          cd build/macos/Build/Products/Release
          zip -r -y "$GITHUB_WORKSPACE/release-artifacts/MediaGrab-macos.zip" MediaGrab.app
          hdiutil create -volname "MediaGrab" -srcfolder MediaGrab.app -ov -format UDZO "$GITHUB_WORKSPACE/release-artifacts/MediaGrab-macos.dmg"
          cd -

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-artifacts/*

  build-windows:
    name: Build Windows Desktop (.zip & setup.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Package Windows Portable Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-artifacts"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "release-artifacts\MediaGrab-windows-x64.zip" -Force

      - name: Install Inno Setup & Compile Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\inno_setup.iss
          if (Test-Path "build\windows\installer\MediaGrab-windows-setup.exe") {
            Copy-Item "build\windows\installer\MediaGrab-windows-setup.exe" -Destination "release-artifacts\MediaGrab-windows-setup.exe"
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-artifacts/*

  build-linux:
    name: Build Linux Desktop (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Package Linux App
        run: |
          mkdir -p release-artifacts
          tar -czvf release-artifacts/MediaGrab-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-artifacts/*

  publish-release:
    name: Publish Multi-Platform Release
    needs: [build-android, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          prerelease: true
