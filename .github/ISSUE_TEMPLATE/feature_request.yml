name: Feature Request
description: Suggest an idea or architectural improvement for MediaGrab
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature for MediaGrab! Please explain your idea clearly below.

  - type: textarea
    id: problem_statement
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem (e.g., "I'm always frustrated when [...]").
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives_considered
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions, workarounds, or features you have considered.

  - type: checkboxes
    id: target_platforms
    attributes:
      label: Relevant Platforms
      description: Which platforms would benefit most from this feature?
      options:
        - label: Android
        - label: iOS
        - label: macOS
        - label: Windows
        - label: Linux

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and feature requests to verify this is not a duplicate.
          required: true
        - label: This suggestion adheres to the project's scope and guidelines.
          required: true
